<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY DESIGN HOME</title>
  <link rel="preload" as="image" href="弹窗/0-loading页-1.png">
  <link rel="preload" as="image" href="弹窗/0-loading页-2.png">
  <style>
    @font-face { font-family: 'Press Start 2P'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/vendor/press-start-2p.ttf') format('truetype'); }
    :root {
      --bg-beige: #E5DCC5;
      --blue: #2E5BFF;
      --red: #E63946;
      --yellow: #FFD60A;
      --black: #1A1A1A;
      --white: #FFFFFF;
      --pixel: 'Press Start 2P', cursive;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-beige);
      font-family: var(--pixel);
      color: var(--black);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* ---------- LOADING ---------- */
    #loading-scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-beige);
      z-index: 100;
    }

    .loading-house {
      position: relative;
      width: min(620px, 82vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-house img {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.08));
    }

    .loading-bar-wrap {
      width: min(320px, 60vw);
      height: 14px;
      background: rgba(255,255,255,0.6);
      border: 3px solid var(--black);
      border-radius: 999px;
      margin-top: 8px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
    }

    .loading-text {
      margin-top: 18px;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--black);
      opacity: 0.85;
    }

    .loading-note {
      margin-top: 14px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #66754A;
      opacity: 0.72;
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 18px;
      border-radius: 2px;
      opacity: 0.9;
      pointer-events: none;
    }

    /* ---------- SCENE 01 ENTRANCE ---------- */
    #scene-01 {
      z-index: 20;
    }

    .room-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.06);
    }

    .scene-title {
      position: absolute;
      left: 3%;
      top: 4%;
      width: min(300px, 28vw);
      z-index: 5;
      transform-origin: left top;
      opacity: 0;
      transform: scale(0) rotate(-8deg);
      filter: drop-shadow(0 8px 0 rgba(0,0,0,0.12));
    }

    .scene-title img {
      width: 100%;
      height: auto;
    }

    .door-knob-zone {
      position: absolute;
      left: 58.5%;
      top: 43%;
      width: 8%;
      height: 14%;
      z-index: 6;
      cursor: pointer;
      border-radius: 50%;
      /* debug outline */
      /* outline: 2px dashed rgba(255,0,0,0.4); */
    }

    .door-knob-sticker {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150%;
      height: auto;
      transform: translate(-50%, -50%) scale(0) rotate(-20deg);
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.18));
    }

    .door-hint {
      position: absolute;
      left: 50%;
      top: 155%;
      transform: translateX(-50%);
      font-family: var(--pixel);
      font-size: 12px;
      color: var(--white);
      background: var(--black);
      padding: 10px 14px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 4px 4px 0 var(--yellow);
    }

    /* Sticker popups inside hotspots */
    .sticker-popup {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 220%;
      height: auto;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.18));
      z-index: 20;
    }

    .sticker-popup img {
      width: 100%;
      height: auto;
    }

    /* Living room robot sticker - upper right of the robot */
    .hs-ip .sticker-popup {
      left: 75%;
      top: 15%;
      width: 200%;
    }

    /* Close-up stickers default */
    .closeup-hotspot .sticker-popup {
      top: 45%;
      width: 140%;
    }

    /* Work poster close-up sticker - moved right */
    .hs-work-poster .sticker-popup {
      left: 55%;
      top: 45%;
      width: 130%;
    }

    /* Computer close-up sticker - slightly larger and right */
    .hs-computer .sticker-popup {
      left: 62%;
      top: 65%;
      width: 152%;
    }

    .pixel-hint {
      position: absolute;
      left: 50%;
      bottom: -36px;
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--white);
      background: var(--black);
      padding: 10px 14px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 4px 4px 0 var(--yellow);
      z-index: 20;
    }

    .skip-link {
      position: absolute;
      right: 4%;
      bottom: 5%;
      font-size: 10px;
      color: var(--black);
      background: var(--white);
      padding: 10px 14px;
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--blue);
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 8;
    }

    .skip-link:hover {
      transform: translateY(0) translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--red);
    }

    /* ---------- SCENE 02 LIVING ROOM ---------- */
    #scene-02 {
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      z-index: 15;
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    }

    .hotspot::after {
      content: '';
      position: absolute;
      inset: -8px;
      border: 3px dashed var(--white);
      border-radius: 16px;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .hotspot:hover {
      transform: scale(1.06) rotate(-1deg);
      filter: drop-shadow(0 0 0 4px var(--white)) drop-shadow(0 8px 20px rgba(0,0,0,0.18));
    }

    .hotspot:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    .hotspot-label {
      position: absolute;
      left: 50%;
      bottom: -34px;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--white);
      background: var(--black);
      padding: 7px 10px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 3px 3px 0 var(--yellow);
    }

    .hotspot:hover .hotspot-label {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    /* For hotspots with GET CLOSER hint, hide the default label on hover */
    .hs-work:hover .hotspot-label,
    .hs-studio:hover .hotspot-label {
      opacity: 0;
    }

    /* Robot hotspot uses sticker only: no label & no dashed border */
    .hs-ip .hotspot-label {
      display: none;
    }
    .hs-ip:hover::after {
      opacity: 0;
    }

    /* IP on sofa */
    .hs-ip {
      left: 59.5%;
      top: 55.5%;
      width: 9.5%;
      height: 15%;
    }

    /* MY WORK poster */
    .hs-work {
      right: 4%;
      top: 13%;
      width: 16%;
      height: 26%;
    }

    /* Studio desk */
    .hs-studio {
      left: 4%;
      top: 32%;
      width: 28%;
      height: 30%;
    }


    .back-btn {
      position: absolute;
      left: 3%;
      top: 3%;
      z-index: 25;
      font-size: 10px;
      color: var(--black);
      background: var(--white);
      padding: 10px 14px;
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--yellow);
      cursor: pointer;
      opacity: 0;
      transform: translateX(-20px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(0) translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--blue);
    }

    /* ---------- SCENE 03 MY WORK CLOSE-UP ---------- */
    #scene-03 { z-index: 30; }
    #scene-04 { z-index: 30; }
    #scene-05 { z-index: 40; }

    .closeup-hotspot {
      position: absolute;
      z-index: 15;
      cursor: pointer;
      border-radius: 12px;
    }

    /* Work poster close-up hotspot - strictly the poster area */
    .hs-work-poster {
      left: 45%;
      top: 5%;
      width: 28%;
      height: 70%;
    }

    /* Computer close-up hotspot - monitor + keyboard only */
    .hs-computer {
      left: 35%;
      top: 28%;
      width: 25%;
      height: 52%;
    }

    /* Trophy hotspot in scene 04 - upper right */
    .hs-trophy {
      left: 74%;
      top: 2%;
      width: 13%;
      height: 21%;
      border: 3px dashed transparent;
      border-radius: 14px;
      transition: border-color .2s ease;
    }

    .hs-trophy:hover,
    .hs-trophy:focus-visible {
      border-color: #FFFFFF;
      box-shadow: none;
    }

    .trophy-hint {
      position: absolute;
      left: 50%;
      bottom: -36px;
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--white);
      background: var(--black);
      padding: 10px 14px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 4px 4px 0 var(--yellow);
      transform: translateX(-50%) scale(0);
      transition: opacity .2s ease, transform .2s ease;
      z-index: 21;
    }

    .hs-trophy:hover .trophy-hint,
    .hs-trophy:focus-visible .trophy-hint {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Scene 05 trophy sticker overlay - aligned to the trophy in the honor wall image */
    .hs-trophy-sticker {
      left: 24.8%;
      top: 17.3%;
      width: 24.3%;
      height: 43.2%;
      border: none;
      background: transparent;
    }

    .trophy-sticker-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .hs-trophy-sticker:hover .trophy-sticker-img,
    .hs-trophy-sticker:focus-visible .trophy-sticker-img,
    .hs-trophy-sticker.is-pinned .trophy-sticker-img {
      opacity: 1;
    }

    .honor-selector {
      position: absolute;
      left: calc(100% + 16px);
      top: 22%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .22s ease, visibility .22s ease;
      z-index: 22;
    }

    .honor-circle {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 2px solid #1a1a1a;
      border-radius: 50%;
      outline: 3px solid #F3EBDD;
      background: #F1D52F;
      color: #1a1a1a;
      box-shadow: 3px 4px 0 #1a1a1a;
      cursor: pointer;
      font: 700 13px/1.2 'Microsoft YaHei', 'Work Labels', sans-serif;
      transition: transform .22s ease, background .22s ease;
    }

    .honor-circle:nth-child(2) { background: #A8DDDA; }
    .honor-circle:nth-child(3) { background: #F3EBDD; }

    .honor-circle:hover,
    .honor-circle:focus-visible {
      transform: translateY(-2px) scale(1.07);
    }

    .hs-trophy-sticker:hover .honor-selector,
    .hs-trophy-sticker:focus-visible .honor-selector,
    .hs-trophy-sticker.is-pinned .honor-selector {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* utility */
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .loading-text { font-size: 9px; }
      .door-hint { font-size: 9px; }
      .scene-title { width: 46vw; top: 3%; left: 3%; }
      .hotspot-label { font-size: 7px; bottom: -26px; padding: 5px 7px; }
    }
  
    /* Mouse-click affordance for clickable hotspots */
    .hotspot-label,
    .pixel-hint,
    .trophy-hint,
    .door-hint {
      display: inline-flex;
      align-items: center;
    }

    .hotspot-label::after,
    .pixel-hint::after,
    .trophy-hint::after,
    .door-hint::after {
      content: '';
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-left: 7px;
      vertical-align: middle;
      background: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%3E%3Cpath%20d=%27M5%204l12%206.5-5.2%201.6-1.4%205.4z%27%20fill=%27%23FFFFFF%27%20stroke=%27%231A1A1A%27%20stroke-width=%271.7%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E") center / contain no-repeat;
    }

  </style>
  <link rel="stylesheet" href="assets/work-viewer.css" />
  <link rel="stylesheet" href="assets/with-ai-viewer.css" />
  <link rel="stylesheet" href="assets/honors-viewer.css" />
  <link rel="stylesheet" href="assets/entrance-guide.css" />
  <link rel="stylesheet" href="assets/work-gallery.css" />
</head>
<body>
  <div id="app">
    <!-- LOADING -->
    <section id="loading-scene" class="scene active">
      <div class="loading-house">
        <img src="弹窗/0-loading页-1.png" alt="MY DESIGN HOME" id="loading-house-img" />
      </div>
      <div class="loading-note">初始加载可能稍慢，感谢您的时间~</div>
      <div class="loading-bar-wrap">
        <div class="loading-bar" id="loading-bar"></div>
      </div>
      <div class="loading-text" id="loading-text">LOADING MY DESIGN HOME... 0%</div>
    </section>

    <!-- SCENE 01 ENTRANCE -->
    <section id="scene-01" class="scene">
      <img src="scenes/01玄关.png" alt="Entrance" class="room-bg" id="bg-01" />
      <div class="scene-title" id="scene-title" role="button" tabindex="0" aria-label="查看进入作品网站的提示" aria-controls="entrance-guide" aria-expanded="false">
        <img src="3c560f5c-4cfc-410b-9ef4-a972405f5af5.png" alt="MY DESIGN HOME" />
      </div>
      <div class="door-knob-zone" id="door-knob-zone" data-scene-rect="58.5 43 8 14">
        <img src="弹窗/1-门把手.png" alt="door knob sticker" class="door-knob-sticker" id="door-knob-sticker" />
        <div class="door-hint" id="door-hint">COME IN →</div>
      </div>
      <button class="skip-link" id="skip-link">SKIP TO WORK →</button>
    </section>

    <!-- SCENE 02 LIVING ROOM -->
    <section id="scene-02" class="scene">
      <img src="scenes/02客厅1.png" alt="Living Room" class="room-bg" id="bg-02" />
      <button class="back-btn" id="back-btn">← BACK</button>

      <div class="hotspot hs-ip" data-label="ABOUT ME" data-scene-rect="58.2 51.8 10.2 15">
        <span class="hotspot-label">ABOUT ME</span>
        <div class="sticker-popup" id="ip-sticker">
          <img src="弹窗/1-about me.png" alt="About Me sticker" />
        </div>
      </div>
      <div class="hotspot hs-work" data-label="MY WORK" data-scene-rect="80 13 16 26">
        <span class="hotspot-label">MY WORK</span>
        <div class="pixel-hint" id="work-hint">GET CLOSER</div>
      </div>
      <div class="hotspot hs-studio" data-label="STUDIO / AIGC LAB" data-scene-rect="4 32 28 30">
        <span class="hotspot-label">STUDIO / AIGC LAB</span>
        <div class="pixel-hint" id="studio-hint">GET CLOSER</div>
      </div>

    </section>

    <!-- SCENE 03 MY WORK CLOSE-UP -->
    <section id="scene-03" class="scene">
      <img src="scenes/03特写作品海报.png" alt="My Work Poster Close-up" class="room-bg" id="bg-03" />
      <button class="back-btn" data-back="living">← BACK</button>
      <div class="closeup-hotspot hs-work-poster" data-label="POSTER" data-scene-rect="45 5 28 70">
        <div class="sticker-popup" id="work-poster-sticker">
          <img src="弹窗/2-about my work.png" alt="About My Work sticker" />
        </div>
      </div>
    </section>

    <!-- SCENE 04 WITH AI CLOSE-UP -->
    <section id="scene-04" class="scene">
      <img src="scenes/04特写电脑.png" alt="Computer Close-up" class="room-bg" id="bg-04" />
      <button class="back-btn" data-back="living">← BACK</button>
      <div class="closeup-hotspot hs-computer" data-label="COMPUTER" data-scene-rect="35 28 25 52">
        <div class="sticker-popup" id="computer-sticker">
          <img src="弹窗/4-with AI-2.png" alt="With AI sticker" />
        </div>
      </div>
      <div class="closeup-hotspot hs-trophy" data-label="TROPHY" data-scene-rect="74 2 13 21" role="button" tabindex="0" aria-label="查看荣誉陈列墙">
        <span class="trophy-hint">GET CLOSER</span>
      </div>
    </section>

    <!-- SCENE 05 HONOR WALL CLOSE-UP -->
    <section id="scene-05" class="scene">
      <img src="scenes/05特写荣誉陈列墙.png" alt="Honor Wall Close-up" class="room-bg" id="bg-05" />
      <button class="back-btn" data-back="scene04">← BACK</button>
      <div class="closeup-hotspot hs-trophy-sticker" data-label="TROPHY" data-scene-rect="24.8 17.3 24.3 43.2" role="button" tabindex="0" aria-label="查看荣誉奖杯贴纸">
        <img src="弹窗/5-my honors.png" alt="My Honors sticker" class="trophy-sticker-img" />
        <nav class="honor-selector" aria-label="选择荣誉类别">
          <button class="honor-circle" data-honor="national" aria-label="打开国奖">国奖</button>
          <button class="honor-circle" data-honor="province" aria-label="打开省奖">省奖</button>
          <button class="honor-circle" data-honor="school" aria-label="打开校奖">校奖</button>
        </nav>
      </div>
    </section>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    const loading = document.getElementById('loading-scene');
    const scene01 = document.getElementById('scene-01');
    const scene02 = document.getElementById('scene-02');
    const scene03 = document.getElementById('scene-03');
    const scene04 = document.getElementById('scene-04');
    const scene05 = document.getElementById('scene-05');
    const bar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');
    const houseImg = document.getElementById('loading-house-img');

    const doorKnobZone = document.getElementById('door-knob-zone');
    const doorKnobSticker = document.getElementById('door-knob-sticker');
    const doorHint = document.getElementById('door-hint');
    const skipLink = document.getElementById('skip-link');
    const backBtns = document.querySelectorAll('.back-btn');

    const ipSticker = document.getElementById('ip-sticker');
    const workHint = document.getElementById('work-hint');
    const studioHint = document.getElementById('studio-hint');
    const workPosterSticker = document.getElementById('work-poster-sticker');
    const computerSticker = document.getElementById('computer-sticker');

    const hsIp = document.querySelector('.hs-ip');
    const hsWork = document.querySelector('.hs-work');
    const hsStudio = document.querySelector('.hs-studio');
    const hsWorkPoster = document.querySelector('.hs-work-poster');
    const hsComputer = document.querySelector('.hs-computer');
    const hsTrophy = document.querySelector('.hs-trophy');
    const hsTrophySticker = document.querySelector('.hs-trophy-sticker');


    // --- Confetti ---
    function spawnConfetti(amount = 40) {
      const colors = ['#2E5BFF', '#E63946', '#FFD60A', '#FFFFFF'];
      for (let i = 0; i < amount; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.transform = `rotate(${Math.random() * 360}deg)`;
        el.style.width = (6 + Math.random() * 8) + 'px';
        el.style.height = (12 + Math.random() * 14) + 'px';
        loading.appendChild(el);

        gsap.to(el, {
          y: window.innerHeight + 60,
          x: (Math.random() - 0.5) * 120,
          rotation: Math.random() * 720 - 360,
          duration: 1.8 + Math.random() * 1.5,
          ease: 'none',
          delay: Math.random() * 0.8,
          onComplete: () => el.remove()
        });
      }
    }

    // --- Loading sequence ---
    function runLoading() {
      const tl = gsap.timeline();

      tl.to(bar, {
        width: '100%',
        duration: 1.0,
        ease: 'power2.inOut',
        onUpdate: function() {
          const p = Math.round(this.progress() * 100);
          loadingText.textContent = `LOADING MY DESIGN HOME... ${p}%`;
        }
      });

      tl.add(() => spawnConfetti(50), 0.7);
      tl.add(() => { houseImg.src = '弹窗/0-loading页-2.png'; }, 0.75);

      tl.to(loading, {
        opacity: 0,
        duration: 0.4,
        delay: 0.1,
        onComplete: () => {
          loading.classList.remove('active');
          scene01.classList.add('active');
          runEntranceIntro();
        }
      });
    }

    // --- Scene 01 intro ---
    function runEntranceIntro() {
      const tl = gsap.timeline();
      tl.fromTo('#bg-01', { scale: 1.12, opacity: 0 }, { scale: 1.06, opacity: 1, duration: 1, ease: 'power2.out' });
      tl.to('#scene-title', {
        scale: 1,
        rotation: 0,
        opacity: 1,
        duration: 0.9,
        ease: 'elastic.out(1, 0.5)'
      }, '-=0.6');
      tl.to(skipLink, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, '-=0.3');

      // subtle ambient float on title
      gsap.to('#scene-title', {
        y: -8,
        duration: 2.2,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut'
      });
    }

    // --- Door knob hover ---
    doorKnobZone.addEventListener('mouseenter', () => {
      gsap.to(doorKnobSticker, { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: 'back.out(2)' });
      gsap.to(doorHint, { opacity: 1, y: -6, duration: 0.25, ease: 'power2.out' });
    });

    doorKnobZone.addEventListener('mouseleave', () => {
      gsap.to(doorKnobSticker, { scale: 0, rotation: -20, opacity: 0, duration: 0.25, ease: 'back.in(1.7)' });
      gsap.to(doorHint, { opacity: 0, y: 0, duration: 0.2 });
    });

    // --- Sticker & hint setup (GSAP manages centering) ---
    const stickers = [ipSticker, workPosterSticker, computerSticker];
    const hints = [workHint, studioHint];
    stickers.forEach(el => gsap.set(el, { xPercent: -50, yPercent: -50, scale: 0, rotation: -14, opacity: 0 }));
    hints.forEach(el => gsap.set(el, { xPercent: -50, scale: 0, opacity: 0 }));

    // --- Living room hover stickers / hints ---
    // About Me sticker lifecycle: assets/about-me.js

    hsWork.addEventListener('mouseenter', () => {
      gsap.to(workHint, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' });
    });
    hsWork.addEventListener('mouseleave', () => {
      gsap.to(workHint, { scale: 0, opacity: 0, duration: 0.2, ease: 'back.in(1.7)' });
    });

    hsStudio.addEventListener('mouseenter', () => {
      gsap.to(studioHint, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' });
    });
    hsStudio.addEventListener('mouseleave', () => {
      gsap.to(studioHint, { scale: 0, opacity: 0, duration: 0.2, ease: 'back.in(1.7)' });
    });

    // --- Close-up scene sticker hovers ---
    // Scene 03 proximity and sticker lifecycle: assets/work-viewer.js

    // Scene 04 proximity, doodle computer and WITH AI entries are handled by assets/with-ai-viewer.js

    // --- Enter close-up scenes ---
    function enterCloseUp(fromScene, toScene, bgSelector) {
      const tl = gsap.timeline();
      tl.to(fromScene, { opacity: 0, scale: 1.08, duration: 0.5, ease: 'power2.inOut' });
      tl.set(fromScene, { visibility: 'hidden', scale: 1 });
      tl.add(() => {
        fromScene.classList.remove('active');
        gsap.set(toScene, { clearProps: 'opacity,visibility' });
        toScene.classList.add('active');
      });
      tl.fromTo(bgSelector, { scale: 1.18, opacity: 0 }, { scale: 1.06, opacity: 1, duration: 0.9, ease: 'power2.out' });
      tl.to(toScene.querySelector('.back-btn'), { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, '-=0.5');
    }

    function backToLivingRoom(fromScene) {
      const tl = gsap.timeline();
      tl.to(fromScene.querySelector('.back-btn'), { opacity: 0, x: -20, duration: 0.2 });
      tl.to(fromScene, { opacity: 0, duration: 0.35 }, '-=0.15');
      tl.set(fromScene, { visibility: 'hidden' });
      tl.add(() => {
        fromScene.classList.remove('active');
        // Clear GSAP inline styles so CSS class controls opacity/visibility
        gsap.set(scene02, { clearProps: 'opacity,visibility' });
        scene02.classList.add('active');
      });
    }

    hsWork.addEventListener('click', () => enterCloseUp(scene02, scene03, '#bg-03'));
    hsStudio.addEventListener('click', () => enterCloseUp(scene02, scene04, '#bg-04'));
    hsTrophy.addEventListener('click', () => enterCloseUp(scene04, scene05, '#bg-05'));
    hsTrophySticker.addEventListener('click', () => { if (window.openHonorsModal) window.openHonorsModal(); });
    document.querySelectorAll('.honor-circle').forEach(btn => {
      btn.addEventListener('click', event => {
        event.stopPropagation();
        if (window.openHonorsModal) window.openHonorsModal(btn.dataset.honor);
      });
    });

    // --- Enter living room ---
    function enterLivingRoom() {
      const tl = gsap.timeline();
      tl.to('#bg-01', { scale: 1.25, x: '-12%', duration: 0.9, ease: 'power2.inOut' });
      tl.to(scene01, { opacity: 0, duration: 0.4 }, '-=0.55');
      tl.set(scene01, { visibility: 'hidden' });
      tl.add(() => {
        scene01.classList.remove('active');
        // Clear GSAP inline styles so CSS class controls opacity/visibility
        gsap.set(scene02, { clearProps: 'opacity,visibility' });
        scene02.classList.add('active');
      });
      tl.fromTo('#bg-02', { scale: 1.18, opacity: 0 }, { scale: 1.06, opacity: 1, duration: 0.9, ease: 'power2.out' });
      tl.to(scene02.querySelector('.back-btn'), { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, '-=0.5');
      tl.fromTo('.hotspot', { scale: 0, opacity: 0 }, {
        scale: 1,
        opacity: 1,
        duration: 0.5,
        stagger: 0.12,
        ease: 'back.out(1.8)'
      }, '-=0.5');
    }

    doorKnobZone.addEventListener('click', enterLivingRoom);

    skipLink.addEventListener('click', () => {
      if (!scene01.classList.contains('active') || skipLink.disabled) return;
      skipLink.disabled = true;
      gsap.set(scene02.querySelector('.back-btn'), { opacity: 1, x: 0 });
      enterCloseUp(scene01, scene03, '#bg-03');
      gsap.delayedCall(1.5, () => { skipLink.disabled = false; });
    });

    function backToComputerCloseUp(fromScene) {
      const tl = gsap.timeline();
      tl.to(fromScene.querySelector('.back-btn'), { opacity: 0, x: -20, duration: 0.2 });
      tl.to(fromScene, { opacity: 0, duration: 0.35 }, '-=0.15');
      tl.set(fromScene, { visibility: 'hidden' });
      tl.add(() => {
        fromScene.classList.remove('active');
        gsap.set(scene04, { clearProps: 'opacity,visibility' });
        scene04.classList.add('active');
      });
    }

    // --- Back buttons ---
    backBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const parent = btn.closest('.scene');
        if (parent === scene02) {
          const tl = gsap.timeline();
          tl.to('.hotspot', { scale: 0, opacity: 0, duration: 0.25, stagger: 0.05, ease: 'back.in(1.7)' });
          tl.to(btn, { opacity: 0, x: -20, duration: 0.2 }, '-=0.2');
          tl.to(scene02, { opacity: 0, duration: 0.35 }, '-=0.15');
          tl.set(scene02, { visibility: 'hidden' });
          tl.add(() => {
            scene02.classList.remove('active');
            // Clear GSAP inline styles so CSS class controls opacity/visibility
            gsap.set(scene01, { clearProps: 'opacity,visibility' });
            scene01.classList.add('active');
            gsap.set('#bg-01', { scale: 1.06, x: '0%' });
          });
        } else if (parent === scene03 || parent === scene04) {
          backToLivingRoom(parent);
        } else if (parent === scene05) {
          backToComputerCloseUp(parent);
        }
      });
    });


    // start
    window.addEventListener('load', () => {
      runLoading();
    });
  </script>
  <script src="assets/works-data.js"></script>
  <script src="assets/work-gallery.js"></script>
  <script src="assets/loading-toast.js"></script>
<script src="assets/work-viewer.js"></script>
  <script src="assets/with-ai-data.js"></script>
  <script src="assets/with-ai-viewer.js"></script>
  <script src="assets/honors-data.js"></script>
  <script src="assets/honors-viewer.js"></script>
  <script src="assets/entrance-guide.js"></script>
  <script src="assets/scene-guide.js"></script>
  <link rel="stylesheet" href="assets/about-me.css">
  <script src="assets/about-me.js"></script>
  <link rel="stylesheet" href="assets/responsive-scenes.css">
  <script src="assets/responsive-scenes.js"></script>
</body>
